<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6e56">
  <title>Bolo: voice intake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot"></span>Bolo <small>voice intake · prototype</small></div>
    <div class="langs" role="radiogroup" aria-label="Language">
      <button data-lang="hi" role="radio" aria-checked="true">हिन्दी</button>
      <button data-lang="bn" role="radio" aria-checked="false">বাংলা</button>
      <button data-lang="en" role="radio" aria-checked="false">English</button>
    </div>
  </header>

  <main>
    <section id="escalation" class="escalation" hidden>
      <div class="esc-text" id="esc-text"></div>
      <a id="esc-call" class="call" href="tel:112">📞 <span>112</span></a>
    </section>

    <section class="chat" id="chat" aria-live="polite">
      <div class="empty" id="empty">
        <p class="big">Tap the microphone and speak.</p>
        <p>Hindi, Bengali, English, or a mix. Describe what you feel in your own words.</p>
      </div>
    </section>

    <section class="card" id="summary" hidden>
      <h2>What we understood</h2>
      <dl id="fields"></dl>
      <details id="clin" hidden><summary>For the clinician</summary><p id="clin-text"></p></details>
    </section>
  </main>

  <footer class="dock">
    <div class="live" id="live"></div>
    <div class="controls">
      <button class="mic" id="mic" aria-label="Speak"><span class="ring"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg></button>
    </div>
    <div class="status" id="status">Ready</div>
    <form id="typed" class="typed" autocomplete="off">
      <input id="typed-in" placeholder="…or type here" aria-label="Type instead of speaking">
      <button type="submit">Send</button>
      <button type="button" id="restart" title="New conversation">↺</button>
    </form>
    <div class="meta" id="meta"></div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
