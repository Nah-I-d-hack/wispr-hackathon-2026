<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d30">
  <title>Call Bolo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="call.css">
</head>
<body>
  <main class="phone" id="phone" data-state="idle">
    <header class="who">
      <div class="avatar" aria-hidden="true"><span>B</span><i class="pulse"></i></div>
      <h1>Bolo</h1>
      <p class="sub" id="sub">Health helpline · speak in your language</p>
      <p class="timer" id="timer" hidden>00:00</p>
      <p class="state" id="state" aria-live="polite"></p>
    </header>

    <section class="pre" id="pre">
      <div class="langs" role="radiogroup" aria-label="Language">
        <button data-lang="hi" role="radio" aria-checked="true">हिन्दी</button>
        <button data-lang="bn" role="radio" aria-checked="false">বাংলা</button>
        <button data-lang="en" role="radio" aria-checked="false">English</button>
      </div>
    </section>

    <section class="alert" id="alert" hidden>
      <p id="alert-text"></p>
      <a id="alert-call" class="dial" href="tel:112">📞 <span>112</span></a>
      <a id="alert-call2" class="dial secondary" href="tel:112" hidden>📞 112</a>
    </section>

    <section class="captions" id="captions" hidden aria-label="Transcript"></section>

    <footer class="controls">
      <button class="round ghost" id="mute" aria-pressed="false" disabled title="Mute">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        <span>Mute</span>
      </button>
      <button class="round call" id="callbtn" aria-label="Call">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1Z"/></svg>
      </button>
      <button class="round ghost" id="cc" aria-pressed="false" title="Show what was said">
        <svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm2 5v4h4v-1.5H7.5v-1H10V10Zm7 0v4h4v-1.5h-2.5v-1H21V10Z"/></svg>
        <span>Text</span>
      </button>
    </footer>
    <p class="meta" id="meta"></p>
  </main>
  <script src="call.js"></script>
</body>
</html>
